services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: firefly_companion_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - FIREFLY_URL=${FIREFLY_URL:-http://192.168.1.25:8012}
      - FIREFLY_TOKEN=${FIREFLY_TOKEN}
      - DATABASE_URL=sqlite:////app/data/companion.db
      - STORAGE_DIR=/app/data/receipts
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://localhost:8000
    volumes:
      - ./data:/app/data
      - ./backend/app:/app/app:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./backend/migrations:/app/migrations:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: firefly_companion_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
