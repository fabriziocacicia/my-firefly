[project]
name = "firefly-companion-backend"
version = "0.1.0"
description = "Companion backend for Firefly III"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "sqlmodel>=0.0.22,<0.1.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "pillow>=10.3.0,<14.0.0",
    "pillow-heif>=0.18.0,<2.0.0",
    "filetype>=1.2.0,<2.0.0",
    "alembic>=1.13.1,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<10.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
